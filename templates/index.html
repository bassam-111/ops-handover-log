<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ops Handover Log</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Ops Handover Log</h1>
  <p><a href="{{ url_for('add') }}">+ Add handover note</a> |
     <a href="{{ url_for('summary') }}">Summary</a></p>
  <form method="get">
    <label>Shift:
      <select name="shift">
        <option value="">All</option>
        {% for s in shifts %}<option value="{{ s }}" {% if s == shift %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <label>Status:
      <select name="status">
        <option value="">All</option>
        {% for s in statuses %}<option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Filter</button>
  </form>
  <table>
    <tr><th>Date</th><th>Shift</th><th>Outgoing → Incoming</th><th>Status</th><th>Blockers</th></tr>
    {% for n in notes %}
    <tr>
      <td>{{ n.log_date }}</td>
      <td>{{ n.shift }}</td>
      <td><a href="{{ url_for('detail', note_id=n.id) }}">{{ n.outgoing }} → {{ n.incoming }}</a></td>
      <td>{{ n.status }}</td>
      <td>{{ n.blockers }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5">No handover notes yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
